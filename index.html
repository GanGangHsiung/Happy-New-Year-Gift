<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 蛇年大吉 - 熊剛的紅包抽獎</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary-red: #e63946; --gold: #ffb703; --pink: #ff69b4; --dark-red: #9b2226; --shiny-gold: #fff3b0; --bg-gradient: linear-gradient(135deg, #8b0000 0%, #e63946 50%, #d00000 100%); }
        body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg-gradient); height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        
        /* 特效：紅包雨 */
        .red-packet { position: absolute; width: 30px; height: 45px; background: #ff4d4d; border: 2px solid #ffcc00; border-radius: 4px; top: -50px; z-index: 1; opacity: 0.7; pointer-events: none; animation: fall linear infinite; }
        .red-packet::after { content: "🧧"; display: flex; justify-content: center; align-items: center; font-size: 15px; height: 100%; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        .container { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); padding: 2rem; border-radius: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); width: 90%; max-width: 420px; text-align: center; border: 5px solid var(--gold); position: relative; z-index: 10; }
        .step { display: none; animation: fadeIn 0.6s cubic-bezier(0.39, 0.575, 0.565, 1); }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        h2 { color: var(--dark-red); margin-bottom: 1rem; font-size: 1.8rem; font-weight: 900; }
        button { background: linear-gradient(to bottom, var(--primary-red), var(--dark-red)); color: white; border: none; padding: 16px 28px; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 0 6px 20px rgba(155, 34, 38, 0.4); transition: 0.3s; width: 100%; margin-top: 10px; }
        
        /* 福袋搖晃動畫 */
        .lucky-bag { font-size: 80px; display: none; margin: 20px auto; animation: shake 0.5s infinite; cursor: default; }
        @keyframes shake { 0% { transform: rotate(0deg); } 25% { transform: rotate(10deg); } 50% { transform: rotate(0deg); } 75% { transform: rotate(-10deg); } 100% { transform: rotate(0deg); } }
        
        /* 數字跳動與插卡 */
        .slot-machine { background: linear-gradient(145deg, #fff0f5, #fff9f0); border-radius: 20px; padding: 20px 10px; margin: 15px 0; border: 3px double var(--gold); }
        .slot-reel { width: 45px; height: 65px; background: white; border: 2px solid var(--gold); border-radius: 8px; font-size: 2.5rem; font-weight: 900; color: var(--primary-red); display: flex; justify-content: center; align-items: center; text-shadow: 2px 2px 0px var(--shiny-gold); overflow: hidden; }
        .spinning { filter: blur(2px); transform: scale(0.95); transition: 0.1s; }
        .final-amount { font-size: 4rem; color: var(--primary-red); font-weight: 900; text-shadow: 4px 4px 0px var(--gold); background: linear-gradient(90deg, #ffb703, #fff, #ffb703); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: goldShine 3s linear infinite; display: inline-block; }
        @keyframes goldShine { 0% { background-position: -200%; } 100% { background-position: 200%; } }
        
        .line-btn { background: linear-gradient(135deg, #00B900 0%, #009900 100%); display: none; margin-top: 20px; animation: pulse-line 2s infinite; }
        @keyframes pulse-line { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 185, 0, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(0, 185, 0, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 185, 0, 0); } }
    </style>
</head>
<body onclick="AudioManager.init()">

<audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
<audio id="spinSound" src="https://assets.mixkit.co/active_storage/sfx/2016/2016-preview.mp3"></audio>
<audio id="stopSound" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>
<audio id="cheerSound" src="https://assets.mixkit.co/active_storage/sfx/2004/2004-preview.mp3"></audio>
<audio id="finalCheer" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="popSound" src="https://assets.mixkit.co/active_storage/sfx/2017/2017-preview.mp3"></audio>

<div class="container">
    <div id="step1" class="step active">
        <h2>🐍 2026 靈蛇獻瑞</h2>
        <input type="text" id="nameInput" placeholder="請輸入誰是世界上最帥的兒子？">
        <button onclick="App.checkStep1()">開啟福氣門</button>
    </div>

    <div id="step2" class="step">
        <h2>🐍 龍去蛇來</h2>
        <select id="satisfaction">
            <option value="">-- 請給予愛的評分 --</option>
            <option value="100">✨ 完美！兒子是我的驕傲</option>
            <option value="90">✨ 優秀！今年表現亮眼</option>
        </select>
        <button onclick="App.checkStep2()">確認評鑑</button>
    </div>

    <div id="step3" class="step">
        <h2>💖 熊剛的悄悄話</h2>
        <p>親愛的媽媽，今年的紅包代表我滿滿的感謝。不論抽到多少，孝心都不打折！</p>
        <button onclick="App.nextStep(3, '3_5')">辛苦了，乖兒子</button>
    </div>

    <div id="step3_5" class="step">
        <h2>🧧 財氣匯聚中</h2>
        <p>媽媽，妳準備好要開始抽取<br><b style="color:var(--primary-red); font-size: 1.4rem;">新年特大紅包</b>了嗎？</p>
        <button onclick="App.nextStep('3_5', 4)">我準備好了！大獎來！</button>
    </div>

    <div id="step4" class="step">
        <h2>🎰 財神來敲門</h2>
        <div class="slot-machine">
            <div style="display: flex; justify-content: center; gap: 4px; margin-bottom: 15px;">
                <div class="slot-reel" id="reel0">$</div>
                <div class="slot-reel" id="reel1">0</div>
                <div class="slot-reel" id="reel2">0</div>
                <div class="slot-reel" id="reel3">0</div>
                <div class="slot-reel" id="reel4">0</div>
                <div class="slot-reel" id="reel5">0</div>
            </div>
            <div id="historyPills"></div>
        </div>
        <button id="drawBtn" onclick="App.draw()">點我抽紅包 (剩 3 次)</button>
    </div>

    <div id="step5" class="step">
        <div id="luckyBag" class="lucky-bag">💰</div> <div id="resultContent">
            <div style="font-size: 1.8rem; color: var(--dark-red); font-weight: 900;">🧧 恭喜媽媽 🧧</div>
            <p>您的 2026 蛇年紅包總額：</p>
            <div id="bonusDisplay" style="display:none; color: var(--pink); font-size: 1.2rem; font-weight: bold;">
                兒子驚喜加碼：+$<span id="bonusValue">0</span>
            </div>
            <div class="final-amount" id="finalPrize">$0</div>
            
            <div id="praiseSection" style="display:none; margin-top: 20px; padding: 15px; background: #fffceb; border-radius: 15px; border: 2px dashed var(--gold);">
                <p style="font-weight: bold; color: #d4a017;">✨ 偷偷告訴妳 ✨</p>
                <p style="font-size: 0.95rem;">這個程式、網頁、運作邏輯、甚至連紅包雨的架構都是妳兒子<b>親手寫的</b>，是不是非常厲害！</p>
                <button onclick="LineBridge.send(App.state.finalMaxAmount)">真的非常厲害！領紅包去 ❤️</button>
            </div>
        </div>
    </div>
</div>

<script>
    const Config = { minBase: 10800, maxBase: 36800, pinkGoldColors: ['#ff69b4', '#ffd700', '#ffffff'] };

    const AudioManager = {
        play(id) { const el = document.getElementById(id); if (el) { el.currentTime = 0; el.play(); } },
        init() { ['clickSound', 'spinSound', 'stopSound', 'cheerSound', 'finalCheer', 'popSound'].forEach(id => { const a = document.getElementById(id); if(a){a.play(); a.pause();} }); document.body.onclick = null; },
        speak(text) { const msg = new SpeechSynthesisUtterance(text); msg.lang = 'zh-TW'; window.speechSynthesis.speak(msg); }
    };

    const Visuals = {
        createRain() {
            const rp = document.createElement('div'); rp.className = 'red-packet';
            rp.style.left = Math.random() * 100 + 'vw';
            rp.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(rp); setTimeout(() => rp.remove(), 5000);
        },
        launchEpicConfetti() {
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, colors: Config.pinkGoldColors });
            setInterval(() => {
                confetti({ particleCount: 5, angle: 60, origin: { x: 0, y: 0.8 } });
                confetti({ particleCount: 5, angle: 120, origin: { x: 1, y: 0.8 } });
            }, 300);
        }
    };

    const LineBridge = {
        send(amount) {
            const msg = `兒子！紅包最後金額是：$${amount.toLocaleString()}\n我剛剛看到網頁了，你真的太厲害了！❤️`;
            const url = `https://line.me/R/msg/text/?${encodeURIComponent(msg)}`;
            const a = document.createElement('a'); a.href = url; a.click();
        }
    };

    const App = {
        state: { scores: [], count: 3, finalMaxAmount: 0 },

        nextStep(current, next) {
            AudioManager.play('clickSound');
            document.getElementById('step' + current).classList.remove('active');
            document.getElementById('step' + next).classList.add('active');
        },

        checkStep1() { if (document.getElementById('nameInput').value.includes("熊剛")) this.nextStep(1, 2); else alert("輸入熊剛試試看！"); },
        checkStep2() { if (document.getElementById('satisfaction').value !== "") this.nextStep(2, 3); },

        draw() {
            const btn = document.getElementById('drawBtn'); btn.disabled = true;
            AudioManager.play('spinSound');
            const finalAmount = Math.floor(Math.random() * (Config.maxBase - Config.minBase + 1) + Config.minBase);
            // 簡化滾動邏輯以節省空間
            const reels = [1,2,3,4,5].map(i => document.getElementById('reel' + i));
            setTimeout(() => {
                reels.forEach((r, i) => { r.innerText = finalAmount.toString().padStart(5,'0')[i]; });
                this.state.scores.push(finalAmount);
                this.state.count--;
                AudioManager.play('stopSound');
                if (this.state.count > 0) { btn.disabled = false; btn.innerText = `再抽一次 (剩 ${this.state.count} 次)`; }
                else { btn.disabled = false; btn.innerText = "查看最終加碼成果"; btn.onclick = () => this.showFinal(); }
            }, 1500);
        },

        showFinal() {
            this.nextStep(4, 5);
            const bag = document.getElementById('luckyBag');
            const content = document.getElementById('resultContent');
            
            // 初始隱藏結果內容，顯示搖晃福袋
            content.style.display = 'none';
            bag.style.display = 'block';
            AudioManager.play('spinSound');

            setTimeout(() => {
                // 福袋炸開
                bag.style.display = 'none';
                content.style.display = 'block';
                AudioManager.play('popSound');
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 } });

                // 公布金額
                let basePrize = Math.max(...this.state.scores);
                const extra = Math.floor(Math.random() * 2000) + 3000;
                this.state.finalMaxAmount = basePrize + extra;
                
                document.getElementById('finalPrize').innerText = "$" + this.state.finalMaxAmount.toLocaleString();
                document.getElementById('bonusValue').innerText = extra.toLocaleString();
                document.getElementById('bonusDisplay').style.display = 'block';
                
                Visuals.launchEpicConfetti();
                AudioManager.speak(`恭喜媽媽，總金額${this.state.finalMaxAmount}元`);
                
                // 3秒後顯示讚美兒子的區塊
                setTimeout(() => {
                    document.getElementById('praiseSection').style.display = 'block';
                    document.getElementById('praiseSection').scrollIntoView({ behavior: 'smooth' });
                }, 2000);

            }, 2500); // 福袋搖晃 2.5 秒
        }
    };

    setInterval(Visuals.createRain, 400);
</script>
</body>
</html>
