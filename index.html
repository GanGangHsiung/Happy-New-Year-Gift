<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 蛇年大吉 - 熊剛的紅包抽獎</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-red: #e63946;
            --gold: #ffb703;
            --pink: #ff69b4;
            --dark-red: #9b2226;
            --shiny-gold: #fff3b0;
            --bg-gradient: linear-gradient(135deg, #8b0000 0%, #e63946 50%, #d00000 100%);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 105, 180, 0.15) 0%, transparent 20%),
                radial-gradient(circle at 80% 70%, rgba(255, 215, 0, 0.15) 0%, transparent 20%);
        }

        @keyframes shine {
            0% { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); }
            50% { border-color: var(--pink); box-shadow: 0 0 30px var(--pink); }
            100% { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 420px;
            text-align: center;
            border: 5px solid var(--gold);
            position: relative;
            animation: shine 3s infinite ease-in-out;
            z-index: 10;
        }

        .step { display: none; animation: fadeIn 0.6s cubic-bezier(0.39, 0.575, 0.565, 1); }
        .step.active { display: block; }

        @keyframes fadeIn { 
            from { opacity: 0; transform: scale(0.9) translateY(20px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }

        h2 { color: var(--dark-red); margin-bottom: 1rem; font-size: 1.8rem; font-weight: 900; }
        p { color: #444; line-height: 1.6; font-size: 1rem; }

        input, select {
            width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #eee; border-radius: 15px; font-size: 1rem; outline: none; box-sizing: border-box;
        }

        button {
            background: linear-gradient(to bottom, var(--primary-red), var(--dark-red));
            color: white; border: none; padding: 16px 28px; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 0 6px 20px rgba(155, 34, 38, 0.4); transition: 0.3s; width: 100%; margin-top: 10px;
        }

        .line-btn {
            background: linear-gradient(135deg, #00B900 0%, #009900 100%);
            display: none;
            margin-top: 20px;
            animation: pulse-line 2s infinite;
        }

        @keyframes pulse-line {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 185, 0, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(0, 185, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 185, 0, 0); }
        }

        .slot-machine {
            background: linear-gradient(145deg, #fff0f5, #fff9f0);
            border-radius: 20px; padding: 20px 10px; margin: 15px 0; border: 3px double var(--gold);
        }

        .slot-reel {
            width: 45px; height: 65px; background: white; border: 2px solid var(--gold); border-radius: 8px;
            font-size: 2.5rem; font-weight: 900; color: var(--primary-red);
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.1); text-shadow: 2px 2px 0px var(--shiny-gold); overflow: hidden;
        }

        .spinning { filter: blur(2px); transform: scale(0.95); transition: 0.1s; }

        .history-pills { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 10px;}
        .pill { background: white; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; color: var(--dark-red); border: 1px solid var(--gold); font-weight: bold; }

        .final-amount {
            font-size: 4rem; color: var(--primary-red); margin: 10px 0; font-weight: 900; text-shadow: 4px 4px 0px var(--gold);
        }

        .bonus-tag {
            display: inline-block; background: var(--pink); color: white; padding: 4px 12px; border-radius: 5px; font-weight: bold; font-size: 0.9rem; margin-top: 5px; animation: pulse 1s infinite;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); }
        }
        .pop-animation { animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div id="step1" class="step active">
        <h2 style="letter-spacing: 2px;">🐍 2026 靈蛇獻瑞</h2>
        <p>紅包領取系統身分識別：</p>
        <input type="text" id="nameInput" placeholder="請輸入誰是世界上最帥的兒子？">
        <button onclick="checkStep1()">開啟福氣門</button>
    </div>

    <div id="step2" class="step">
        <h2>🐍 龍去蛇來</h2>
        <p>回顧 2025 年對愛子「熊剛」<br>的綜合評分：</p>
        <select id="satisfaction">
            <option value="">-- 請給予愛的評分 --</option>
            <option value="100">✨ 完美！兒子是我的驕傲</option>
            <option value="90">✨ 優秀！今年表現亮眼</option>
            <option value="80">✨ 滿意！穩定進步中</option>
        </select>
        <button onclick="checkStep2()">確認評鑑</button>
    </div>

    <div id="step3" class="step">
        <h2>💖 熊剛的悄悄話</h2>
        <div style="text-align: left; background: #fff5f5; padding: 15px; border-radius: 15px; border-left: 5px solid var(--primary-red);">
            <p style="margin: 0; font-size: 0.9rem;">
                親愛的媽媽，台北生活壓力大，上班忙到沒空看股市盤面📈。<br><br>
                今年的紅包不只是金額，更代表我滿滿的感謝。<b>不論抽到多少，這份孝心都是不打折的！</b>
            </p>
        </div>
        <button onclick="checkStep3()">辛苦了，乖兒子</button>
    </div>

    <div id="step4" class="step">
        <h2>🎰 財神來敲門</h2>
        <p>系統將連續抽籤三次取最高值<br><b style="color:var(--dark-red)">並隨機獲得兒子加碼！</b></p>
        <div class="slot-machine">
            <div id="slotContainer" style="display: flex; justify-content: center; gap: 4px; margin-bottom: 15px;">
                <div class="slot-reel" id="reel0">$</div>
                <div class="slot-reel" id="reel1">0</div>
                <div class="slot-reel" id="reel2">0</div>
                <div class="slot-reel" id="reel3">0</div>
                <div class="slot-reel" id="reel4">0</div>
                <div class="slot-reel" id="reel5">0</div>
            </div>
            <div class="history-pills" id="historyPills"></div>
        </div>
        <button id="drawBtn" onclick="draw()">點我抽紅包 (剩 3 次)</button>
    </div>

    <div id="step5" class="step">
        <div style="font-size: 2rem; color: var(--dark-red); font-weight: 900;">🧧 恭喜媽媽 🧧</div>
        <p style="margin-top: 10px;">您的 2026 蛇年紅包總額：</p>
        
        <div id="bonusDisplay" style="display:none; color: var(--pink); font-size: 1.5rem; font-weight: bold; margin-bottom: 5px;">
            兒子驚喜加碼：+$<span id="bonusValue">0</span>
        </div>

        <div class="final-amount" id="finalPrize">$0</div>
        
        <div id="bonusContainer">
            <p id="bonusNote" style="color: #d63031; font-weight: bold; margin-bottom: 5px; display: none;">
                ✨ 已偵測到數字 4，自動升級為 8 (發財)！ ✨
            </p>
            <div class="bonus-tag" id="extraBonusTag" style="display:none;">兒子私房錢加碼送達 🚀</div>
        </div>

        <button id="lineBtn" class="line-btn" onclick="sendToLine()">✅ 點擊領取紅包獎金</button>
        <p style="color: #666; font-size: 0.85rem; font-weight: bold; margin-top: 15px;">[ 請截圖此畫面傳給熊剛領獎 ]</p>
    </div>
</div>

<script>
    let scores = [];
    let count = 3;
    let finalMaxAmount = 0;
    const pinkGoldColors = ['#ff69b4', '#ffd700', '#ffffff', '#ff1493', '#ffcc00'];

    function nextStep(current, next) {
        document.getElementById('step' + current).classList.remove('active');
        document.getElementById('step' + next).classList.add('active');
    }

    function checkStep1() {
        if (document.getElementById('nameInput').value.includes("熊剛")) nextStep(1, 2);
        else alert("驗證失敗，只有熊剛的親愛媽媽能進入唷！");
    }

    function checkStep2() {
        if (document.getElementById('satisfaction').value !== "") nextStep(2, 3);
        else alert("請給兒子一個肯定的分數嘛～");
    }

    function checkStep3() { nextStep(3, 4); }

    function speak(text) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-TW';
        msg.rate = 1.1;
        window.speechSynthesis.speak(msg);
    }

    function avoidFour(num) {
        let str = num.toString();
        if (str.includes('4')) return parseInt(str.replace(/4/g, '6'));
        return num;
    }

    function draw() {
        const btn = document.getElementById('drawBtn');
        btn.disabled = true;
        const min = 10800;
        const max = 36800;
        
        let finalAmount = avoidFour(Math.floor(Math.random() * (max - min + 1) + min));
        const finalStr = finalAmount.toString().padStart(5, '0');

        const reels = [
            document.getElementById('reel1'),
            document.getElementById('reel2'),
            document.getElementById('reel3'),
            document.getElementById('reel4'),
            document.getElementById('reel5')
        ];

        document.getElementById('reel0').classList.add('spinning');
        let spinIntervals = reels.map((reel, i) => {
            reel.classList.add('spinning');
            return setInterval(() => {
                reel.innerText = Math.floor(Math.random() * 10);
            }, 50 + (i * 20));
        });

        reels.forEach((reel, i) => {
            setTimeout(() => {
                clearInterval(spinIntervals[i]);
                reel.classList.remove('spinning');
                reel.innerText = finalStr[i];
                if (i === reels.length - 1) {
                    document.getElementById('reel0').classList.remove('spinning');
                    finishDraw(finalAmount);
                }
            }, 1000 + (i * 400));
        });
    }

    function finishDraw(finalAmount) {
        scores.push(finalAmount);
        count--;
        updatePills();
        confetti({ particleCount: 80, spread: 70, colors: pinkGoldColors, origin: { y: 0.6 } });
        const btn = document.getElementById('drawBtn');
        if (count > 0) {
            btn.innerText = `再抽一次 (剩 ${count} 次)`;
            btn.disabled = false;
        } else {
            btn.innerText = "查看最終加碼成果";
            btn.disabled = false;
            btn.onclick = showFinal;
        }
    }

    function updatePills() {
        document.getElementById('historyPills').innerHTML = scores.map(s => `<span class="pill">$${s.toLocaleString()}</span>`).join('');
    }

    function showFinal() {
        let basePrize = Math.max(...scores); 
        const extraGift = Math.floor(Math.random() * (5000 - 3000 + 1) + 3000); 
        finalMaxAmount = basePrize + extraGift; 

        if (finalMaxAmount.toString().includes('4')) {
            finalMaxAmount = parseInt(finalMaxAmount.toString().replace(/4/g, '8'));
            document.getElementById('bonusNote').style.display = 'block';
        }

        nextStep(4, 5); 
        let speed = 2500; 
        let startTime = performance.now();
        
        function animateToBase(now) {
            const progress = Math.min((now - startTime) / speed, 1);
            const currentDisplay = Math.floor(progress * basePrize);
            document.getElementById('finalPrize').innerText = "$" + currentDisplay.toLocaleString();
            
            if (progress < 1) {
                requestAnimationFrame(animateToBase);
            } else {
                setTimeout(() => {
                    const bonusDiv = document.getElementById('bonusDisplay');
                    document.getElementById('bonusValue').innerText = extraGift.toLocaleString();
                    bonusDiv.style.display = 'block';
                    bonusDiv.classList.add('pop-animation'); 

                    setTimeout(() => {
                        document.getElementById('finalPrize').innerText = "$" + finalMaxAmount.toLocaleString();
                        document.getElementById('finalPrize').style.color = 'var(--primary-red)';
                        document.getElementById('finalPrize').style.transform = 'scale(1.1)';
                        document.getElementById('finalPrize').style.transition = '0.3s';
                        
                        document.getElementById('lineBtn').style.display = 'block';
                        document.getElementById('extraBonusTag').style.display = 'inline-block';
                        speak(`恭喜媽媽！基礎獎金${basePrize}元，兒子再加碼${extraGift}元，總額${finalMaxAmount}元！發財了！發財了！發財了！發財了！發財了！`);
                        launchEpicPinkGoldConfetti();
                    }, 800); 
                }, 500);
            }
        }
        requestAnimationFrame(animateToBase);
    }

    function launchEpicPinkGoldConfetti() {
        confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, colors: pinkGoldColors });
        const infiniteConfetti = setInterval(() => {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0, y: 0.8 }, colors: pinkGoldColors });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1, y: 0.8 }, colors: pinkGoldColors });
            if (Math.random() > 0.7) {
                confetti({ particleCount: 15, spread: 80, origin: { x: Math.random(), y: Math.random() - 0.2 }, colors: pinkGoldColors });
            }
        }, 300);
        document.getElementById('lineBtn').addEventListener('click', () => clearInterval(infiniteConfetti));
    }

    function sendToLine() {
        const lineFriendLink = "https://line.me/ti/p/BKTHz2W0VH"; 
        const message = encodeURIComponent(`兒子！我抽到蛇年大紅包了！🧨\n最後金額是：$${finalMaxAmount.toLocaleString()}\n我剛剛還聽到發財了，快發給我！❤️`);
        window.location.href = `https://line.it/R/msg/text/?${message}`;
        setTimeout(() => { if (!document.hidden) window.location.href = lineFriendLink; }, 1000);
    }
</script>
</body>
</html>
