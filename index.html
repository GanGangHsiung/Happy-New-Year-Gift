<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 蛇年大吉 - 熊剛的紅包抽獎</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-red: #e63946;
            --gold: #ffb703;
            --dark-red: #9b2226;
            --bg-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 420px;
            text-align: center;
            border: 4px solid var(--gold);
            position: relative;
        }

        .step { display: none; animation: fadeIn 0.5s ease-out; }
        .step.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { color: var(--dark-red); margin-bottom: 1.5rem; font-size: 1.5rem; }
        p { color: #444; line-height: 1.6; font-size: 1.1rem; }

        /* 輸入與選擇框 */
        input, select {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary-red); }

        /* 按鈕設計 */
        button {
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { transform: scale(1.03); background: var(--dark-red); }
        button:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }

        /* 抽獎區 */
        .slot-machine {
            background: #fff3f3;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border: 2px dashed var(--gold);
        }
        #currentPrize {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary-red);
            margin: 10px 0;
            text-shadow: 2px 2px 0px var(--gold);
        }
        .history-pills {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .pill {
            background: #eee;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            color: #666;
        }

        /* 慶祝畫面 */
        .celebration-title {
            font-size: 2rem;
            color: var(--dark-red);
            margin-bottom: 0.5rem;
        }
        .final-amount {
            font-size: 4rem;
            color: var(--primary-red);
            margin: 20px 0;
            font-weight: 900;
            animation: heartBeat 1.5s infinite;
        }
        @keyframes heartBeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="step1" class="step active">
        <h2>🧧 蛇年好運到</h2>
        <p>為了確保紅包送到對的人手上，<br>請輸入您的身分確認：</p>
        <input type="text" id="nameInput" placeholder="請問您是誰的媽媽？">
        <button onclick="checkStep1()">驗證身分</button>
    </div>

    <div id="step2" class="step">
        <h2>📊 年度評鑑</h2>
        <p>2025 年度對兒子「熊剛」<br>整體表現滿意度：</p>
        <select id="satisfaction">
            <option value="">-- 請選擇 --</option>
            <option value="100">⭐️ 完美無瑕 (大紅包自動升級)</option>
            <option value="90">⭐️ 非常滿意 (值得加碼)</option>
            <option value="80">⭐️ 滿意 (明年繼續保持)</option>
        </select>
        <button onclick="checkStep2()">送出評價</button>
    </div>

    <div id="step3" class="step">
        <h2>💼 溫情告白</h2>
        <p style="text-align: left;">
            親愛的媽媽，台北生活壓力大，上班忙到沒空看股市盤面📈。
            <br><br>
            今年紅包預算可能不如去年厚實，但孝心絕對是不打折的。
            <br><br>
            <b>請問您能否體諒並知曉？</b>
        </p>
        <button onclick="checkStep3()">辛苦了，兒子平安最重要</button>
    </div>

    <div id="step4" class="step">
        <h2>🎰 幸運三連抽</h2>
        <p>系統將紀錄三次金額，並<br><b>取最高者</b>作為最終紅包！</p>
        <div class="slot-machine">
            <div id="currentPrize">$0</div>
            <div class="history-pills" id="historyPills"></div>
        </div>
        <button id="drawBtn" onclick="draw()">點我抽獎 (剩 3 次)</button>
    </div>

    <div id="step5" class="step">
        <div class="celebration-title">🎉 恭喜媽媽 🎉</div>
        <p>最終獲得紅包金額：</p>
        <div class="final-amount" id="finalPrize"></div>
        <p style="color: #d35400; font-weight: bold;">[ 請截圖此畫面傳給熊剛 ]</p>
        <p style="font-size: 0.9rem;">祝您蛇年行大運，身體健康，<br>萬事如意，天天開心！ ❤️</p>
    </div>
</div>

<script>
    let scores = [];
    let count = 3;

    function nextStep(current, next) {
        document.getElementById('step' + current).classList.remove('active');
        document.getElementById('step' + next).classList.add('active');
    }

    function checkStep1() {
        const val = document.getElementById('nameInput').value;
        if (val.includes("熊剛")) {
            nextStep(1, 2);
        } else {
            alert("驗證失敗，只有熊剛的媽媽能領取喔！");
        }
    }

    function checkStep2() {
        if (document.getElementById('satisfaction').value !== "") {
            nextStep(2, 3);
        } else {
            alert("請選個滿意度給兒子一點鼓勵嘛～");
        }
    }

    function checkStep3() {
        nextStep(3, 4);
    }

    function draw() {
        const btn = document.getElementById('drawBtn');
        btn.disabled = true;
        
        // 金額範圍 (你可以自行調整)
        const min = 6600;
        const max = 16800;
        let counter = 0;
        
        // 模擬跳動動畫
        const timer = setInterval(() => {
            const tempAmount = Math.floor(Math.random() * (max - min + 1) + min);
            document.getElementById('currentPrize').innerText = "$" + tempAmount;
            counter++;
            
            if (counter > 15) {
                clearInterval(timer);
                const finalAmount = Math.floor(Math.random() * (max - min + 1) + min);
                document.getElementById('currentPrize').innerText = "$" + finalAmount;
                
                scores.push(finalAmount);
                count--;
                
                updatePills();
                
                if (count > 0) {
                    btn.innerText = `再抽一次 (剩 ${count} 次)`;
                    btn.disabled = false;
                } else {
                    btn.innerText = "查看最大驚喜";
                    btn.disabled = false;
                    btn.onclick = showFinal;
                }
                
                // 單次抽獎成功的碎紙屑
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.6 }
                });
            }
        }, 50);
    }

    function updatePills() {
        const container = document.getElementById('historyPills');
        container.innerHTML = scores.map(s => `<span class="pill">$${s}</span>`).join('');
    }

    function showFinal() {
        const maxPrize = Math.max(...scores);
        document.getElementById('finalPrize').innerText = "$" + maxPrize;
        nextStep(4, 5);
        
        // 終極大噴發動畫
        var duration = 3 * 1000;
        var end = Date.now() + duration;

        (function frame() {
            confetti({
                particleCount: 3,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: ['#ffb703', '#e63946']
            });
            confetti({
                particleCount: 3,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: ['#ffb703', '#e63946']
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }
</script>

</body>
</html>
